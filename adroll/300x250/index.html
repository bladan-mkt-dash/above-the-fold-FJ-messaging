<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="ad.size" content="width=300,height=250" />
  <meta name="viewport" content="width=300, height=250" />
  <title>Five Journeys — 300x250</title>
  <style>
    html, body { margin: 0; padding: 0; width: 300px; height: 250px; overflow: hidden; }
    #clickArea {
      position: relative;
      width: 300px;
      height: 250px;
      box-sizing: border-box;
      border: 1px solid #1d3531;
      background: #faf8f5;
      color: #1a2e2a;
      font-family: Arial, Helvetica, sans-serif;
      cursor: pointer;
      overflow: hidden;
    }
    .wash {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: #eef3f1;
    }
    .mark {
      position: absolute;
      right: -36px;
      top: -48px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: #5da68a;
      opacity: 0.18;
      transform: scale(0.7);
      animation: bloom 0.7s ease-out 0.15s forwards;
    }
    .inner {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 16px 16px 14px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    .brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #264540;
      opacity: 0;
      animation: rise 0.45s ease-out 0.1s forwards;
    }
    h1 {
      margin: 18px 0 0;
      font-size: 22px;
      line-height: 1.18;
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    h1 span {
      display: block;
      opacity: 0;
      transform: translateY(10px);
    }
    h1 span:nth-child(1) { animation: rise 0.45s ease-out 0.35s forwards; }
    h1 span:nth-child(2) { color: #264540; animation: rise 0.45s ease-out 0.5s forwards; }
    .cta {
      margin-top: auto;
      align-self: flex-start;
      background: #264540;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 9px 13px;
      border-radius: 4px;
      opacity: 0;
      transform: translateY(8px);
      animation: rise 0.45s ease-out 0.85s forwards;
    }
    @keyframes rise {
      to { opacity: 1; transform: none; }
    }
    @keyframes bloom {
      to { opacity: 0.22; transform: scale(1); }
    }
  </style>
  <script>
    var clickTag = "https://www.fivejourneys.com";
    function openClickTag() {
      var match = /[?&]clickTag=([^&]+)/i.exec(window.location.search);
      var url = match ? decodeURIComponent(match[1]) : clickTag;
      window.open(url, "_blank");
    }
  </script>
</head>
<body>
  <div id="clickArea" onclick="openClickTag()">
    <div class="wash"></div>
    <div class="mark"></div>
    <div class="inner">
      <div class="brand">Five Journeys</div>
      <h1>
        <span>You Deserve to</span>
        <span>Feel Freaking Amazing™</span>
      </h1>
      <div class="cta">Book a Free Discovery Call</div>
    </div>
  </div>
</body>
</html>
